<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Species AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* แต่งสีสันและฟอนต์สไตล์มินิมอล */
        body { 
            background-color: #f7f7f5; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
            color: #37352f; 
        }
        .container { 
            max-width: 600px; 
            margin-top: 8vh; 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
        }
        .upload-area {
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background-color: #fafafa;
            margin-bottom: 20px;
        }
        .btn-custom { background-color: #2eaadc; color: white; border: none; font-weight: 500; }
        .btn-custom:hover { background-color: #1e87b4; }
        .result-box { 
            margin-top: 20px; 
            padding: 20px; 
            border-radius: 8px; 
            background-color: #f1f1ef; 
            display: none; /* ซ่อนไว้ก่อนจนกว่าจะประมวลผลเสร็จ */
        }
        .species-name { font-size: 1.5rem; font-weight: bold; color: #2eaadc; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="mb-2">🦗 Cricket AI Predictor</h2>
    <p class="text-muted mb-4">อัปโหลดไฟล์เสียงจิ้งหรีดของคุณเพื่อจำแนกสายพันธุ์</p>

    <div class="upload-area">
        <input class="form-control mb-3" type="file" id="audioFile" accept="audio/*, video/mp4">
        <button class="btn btn-custom w-100" id="uploadBtn" onclick="analyzeAudio()">
            <span>วิเคราะห์เสียง</span>
        </button>
    </div>

    <div class="result-box" id="resultBox">
        <h5 class="mb-3">📊 ผลการวิเคราะห์:</h5>
        <p class="mb-1">สายพันธุ์ที่พบ: <span class="species-name" id="outSpecies">-</span></p>
        <p class="mb-1">ความมั่นใจ: <strong id="outConfidence">-</strong></p>
        <p class="text-muted mt-3 mb-0" style="font-size: 0.85rem;" id="outMessage"></p>
    </div>
</div>

<script>
    async function analyzeAudio() {
        const fileInput = document.getElementById('audioFile');
        const uploadBtn = document.getElementById('uploadBtn');
        const resultBox = document.getElementById('resultBox');
        
        if (fileInput.files.length === 0) {
            alert('กรุณาเลือกไฟล์เสียงก่อนครับ!');
            return;
        }

        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append("file", file);

        // เปลี่ยนสถานะปุ่มเป็นกำลังโหลด
        uploadBtn.disabled = true;
        uploadBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> กำลังใช้ AI วิเคราะห์...';
        resultBox.style.display = 'none'; // ซ่อนผลลัพธ์เก่า

        try {
            // ยิงข้อมูลไปที่เซิร์ฟเวอร์ FastAPI ที่เราเปิดไว้
            const response = await fetch('http://127.0.0.1:8000/predict', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.status === 'success') {
                // เอาข้อมูลมาแสดงบนหน้าเว็บ
                document.getElementById('outSpecies').innerText = data.species;
                document.getElementById('outConfidence').innerText = data.confidence;
                document.getElementById('outMessage').innerText = data.message;
                
                resultBox.style.display = 'block'; // โชว์กล่องผลลัพธ์
            } else {
                alert('เกิดข้อผิดพลาด: ' + data.message);
            }
        } catch (error) {
            alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ ตรวจสอบว่าเปิด Backend API ไว้หรือยังครับ');
            console.error(error);
        } finally {
            // คืนค่าปุ่มกลับมาเหมือนเดิม
            uploadBtn.disabled = false;
            uploadBtn.innerHTML = '<span>วิเคราะห์เสียง</span>';
        }
    }
</script>

</body>
</html>
